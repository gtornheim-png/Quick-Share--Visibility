<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NearSense — Motion Comparison</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="chrome">
      <nav class="tabs" role="tablist" aria-label="Prototype views">
        <button
          type="button"
          class="tab-btn is-active"
          role="tab"
          data-tab="compare"
          aria-selected="true"
        >
          Side-by-side
        </button>
        <button
          type="button"
          class="tab-btn"
          role="tab"
          data-tab="multi-a"
          aria-selected="false"
        >
          Treatment A
        </button>
        <button
          type="button"
          class="tab-btn"
          role="tab"
          data-tab="multi-b"
          aria-selected="false"
        >
          Treatment B
        </button>
      </nav>
      <div class="chrome-actions">
        <button type="button" id="reset-btn">Reset</button>
      </div>
    </header>

    <div
      class="tab-panel is-active"
      id="panel-compare"
      data-tab="compare"
      role="tabpanel"
    ></div>

    <div
      class="tab-panel"
      id="panel-multi-a"
      data-tab="multi-a"
      role="tabpanel"
      hidden
    ></div>

    <div
      class="tab-panel"
      id="panel-multi-b"
      data-tab="multi-b"
      role="tabpanel"
      hidden
    ></div>

    <script type="module" src="./app.js?v=visual-polish"></script>
  </body>
</html>
